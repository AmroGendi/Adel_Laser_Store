<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب — Laser Store</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a href="index.html"><img class="web-logo" src="assets/logo-web.png"></a><a class="cart-btn" href="cart.html">🛒 السلة <span id="cartCount">0</span></a></div></header><main class="section"><div class="container checkout"><form id="checkout"><h1 class="section-title">بيانات الطلب.</h1><label>الاسم<input name="name" required></label><label>الهاتف / واتساب<input name="phone" required></label><label>المحافظة والمنطقة<input name="area" required></label><label>العنوان<textarea name="address" required></textarea></label><label>ملاحظات<textarea name="notes"></textarea></label><div class="note"><b>الدفع الإلكتروني</b><p>المشروع جاهز لإضافة Paymob/Fawry لاحقًا. لا تضع مفاتيح الدفع السرية داخل JavaScript أو HTML. حاليًا يتم تأكيد الطلب عبر WhatsApp.</p></div><button class="btn primary full">تأكيد الطلب عبر WhatsApp</button></form><aside class="cart-summary"><h3>ملخص السلة</h3><div id="summary"></div><b id="sumTotal"></b></aside></div></main><script src="js/products.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let c=getCart(),t=0;summary.innerHTML=c.map(i=>{let p=products.find(x=>x.id===i.id);t+=p.price*i.qty;return `<p>${p.name} × ${i.qty} — ${money(p.price*i.qty)}</p>`}).join('');sumTotal.textContent=money(t);checkout.onsubmit=e=>{e.preventDefault();let f=new FormData(checkout),items=c.map(i=>{let p=products.find(x=>x.id===i.id);return p.name+' × '+i.qty}).join('\n');let m=`طلب جديد من Laser Store\nالاسم: ${f.get('name')}\nالهاتف: ${f.get('phone')}\nالمنطقة: ${f.get('area')}\nالعنوان: ${f.get('address')}\nملاحظات: ${f.get('notes')}\n\n${items}\nالإجمالي: ${money(t)}`;window.open('https://wa.me/201000000000?text='+encodeURIComponent(m),'_blank')}})</script></body></html>
